<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JURICALC V3</title><style>body{font:15px system-ui;background:#f3f6fb;color:#162b47;margin:0}header{background:#102e55;color:#fff;padding:20px 30px;font-size:23px;font-weight:750}main{max-width:1150px;margin:28px auto;padding:0 20px}.panel{background:#fff;padding:22px;border-radius:12px;margin-bottom:18px;border:1px solid #dde5ef}input,select,button{padding:10px;margin:5px;border:1px solid #d3deec;border-radius:7px;font:inherit}button{background:#155ca8;color:#fff;cursor:pointer}table{border-collapse:collapse;width:100%}td,th{padding:12px;border-bottom:1px solid #e3e9f2;text-align:left}small{color:#64748b}.danger{color:#bc2525;font-weight:750}.hidden{display:none}</style></head><body><header>⚖ JURICALC — Gestão de Cálculos</header><main><div class="panel" id="setup"><h2>Configuração necessária</h2><p>Configure a URL e a chave pública do Supabase no arquivo index.html para ativar esta versão.</p></div><div class="panel hidden" id="auth"><h2>Entrar</h2><input type="email" id="email" placeholder="E-mail"><input type="password" id="password" placeholder="Senha"><button id="login">Entrar</button><button id="recover">Recuperar senha</button><p id="authmsg"></p></div><div id="app" class="hidden"><div class="panel"><button id="logout" style="float:right">Sair</button><h2>Painel de cálculos</h2><p id="who"></p><p>🔴 <b>Alerta:</b> cálculo parado por 24 horas ou mais.</p><div id="list"></div></div><div class="panel" id="newpanel"><h3>Novo cálculo</h3><input id="name" placeholder="Nome do cálculo"><input id="number" placeholder="Número do processo"><select id="calc"></select><button id="create">Cadastrar</button></div><div class="panel"><h3>Histórico de alterações</h3><div id="history"></div></div><p id="message"></p></div></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const URL='COLOQUE_A_URL_SUPABASE', KEY='COLOQUE_A_CHAVE_PUBLICA_ANON';const $=id=>document.getElementById(id);let client,profile,profiles=[];const states=['Parado','Em andamento','Aguardando PDF','Aguardando digitação','Em digitação','Concluído'];
if(!URL.startsWith('COLOQUE_')&&!KEY.startsWith('COLOQUE_')){$('setup').classList.add('hidden');$('auth').classList.remove('hidden');client=createClient(URL,KEY);init()}
async function init(){const {data:{session}}=await client.auth.getSession();await display(session);client.auth.onAuthStateChange((_e,s)=>{setTimeout(()=>display(s),0)})}
async function display(session){$('auth').classList.toggle('hidden',!!session);$('app').classList.toggle('hidden',!session);if(!session)return;let {data,error}=await client.from('profiles').select('*').eq('id',session.user.id).single();if(error||!data||!data.active){$('app').classList.add('hidden');$('auth').classList.remove('hidden');$('authmsg').textContent='Conta não autorizada.';return}profile=data;$('who').textContent=`${data.display_name} — ${data.role}`;await refresh()}
$('login').onclick=async()=>{let {error}=await client.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('authmsg').textContent=error?error.message:''};$('recover').onclick=async()=>{let {error}=await client.auth.resetPasswordForEmail($('email').value);$('authmsg').textContent=error?error.message:'Se o e-mail estiver cadastrado, receberá instruções.'};$('logout').onclick=()=>client.auth.signOut();
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function refresh(){let [{data:cases,error},{data:ps}]=await Promise.all([client.from('cases').select('*').order('created_at',{ascending:false}),client.from('profiles').select('id,display_name,role,can_assign')]);if(error){$('message').textContent=error.message;return}profiles=ps||[];let calcs=profiles.filter(p=>p.role==='calculista');$('calc').innerHTML=calcs.map(p=>`<option value="${safe(p.id)}">${safe(p.display_name)}</option>`).join('');$('newpanel').classList.toggle('hidden',profile.role==='digitador');$('calc').disabled=profile.role!=='admin';if(profile.role==='calculista')$('calc').value=profile.id;
$('list').replaceChildren();let table=document.createElement('table');table.innerHTML='<tr><th>Cálculo</th><th>Processo</th><th>Calculista</th><th>Status</th><th>Tempo no status</th><th>Atualizar</th><th>Distribuição</th></tr>';for(const c of cases||[]){let tr=document.createElement('tr'),hrs=Math.floor((Date.now()-new Date(c.status_changed_at))/3600000),late=c.status==='Parado'&&hrs>=24;let cells=[c.name,c.case_number,profiles.find(p=>p.id===c.calculator_id)?.display_name||'—',c.status,hrs+'h'];for(let i=0;i<cells.length;i++){let td=document.createElement('td');td.textContent=cells[i];if(late&&i===3)td.className='danger';tr.append(td)}let td=document.createElement('td'),sel=document.createElement('select');let opts=profile.role==='digitador'?['Parado','Em digitação','Concluído']:profile.role==='calculista'?['Parado','Em andamento','Aguardando PDF','Aguardando digitação']:states;sel.append(new Option('Alterar…',''));for(const s of opts)sel.append(new Option(s,s));sel.onchange=async()=>{if(!sel.value)return;let {error}=await client.from('cases').update({status:sel.value}).eq('id',c.id);$('message').textContent=error?.message||'Status atualizado.';await refresh()};td.append(sel);tr.append(td);let dist=document.createElement('td');if(profile.role==='admin'&&profile.can_assign){let d=document.createElement('select');d.append(new Option('Distribuir…',''));for(const p of profiles.filter(p=>p.role==='digitador'))d.append(new Option(p.display_name,p.id));d.onchange=async()=>{if(!d.value)return;let {error}=await client.from('cases').update({typist_id:d.value,status:'Em digitação'}).eq('id',c.id);$('message').textContent=error?.message||'Distribuído.';await refresh()};dist.append(d)}else dist.textContent=profiles.find(p=>p.id===c.typist_id)?.display_name||'—';tr.append(dist);table.append(tr)}$('list').append(table);
let {data:events}=await client.from('case_events').select('*').order('created_at',{ascending:false}).limit(30);$('history').replaceChildren();for(const e of events||[]){let p=document.createElement('p');p.textContent=`${new Date(e.created_at).toLocaleString('pt-BR')} — ${profiles.find(x=>x.id===e.actor_id)?.display_name||'Usuário'}: ${e.old_status||'Novo'} → ${e.new_status||'—'}`;$('history').append(p)}}
$('create').onclick=async()=>{let name=$('name').value.trim(),number=$('number').value.trim();if(!name||!number)return $('message').textContent='Informe nome e número.';let {data:{user}}=await client.auth.getUser();let {error}=await client.from('cases').insert({name,case_number:number,calculator_id:profile.role==='admin'?$('calc').value:profile.id,created_by:user.id});$('message').textContent=error?.message||'Cálculo cadastrado.';if(!error)await refresh()};
</script></body></html>
